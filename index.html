<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DM — 一个关于创造、连接与下一步的简洁数字空间。" />
    <title>DM — Make your mark</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#top" aria-label="DM 首页">DM<span class="brand-dot">.</span></a>
        <nav class="site-nav" aria-label="主导航">
          <a href="#about">About</a>
          <a href="#contact">Contact</a>
          <button class="theme-toggle" type="button" aria-label="切换主题" aria-pressed="false">
            <span class="theme-icon" aria-hidden="true">☼</span>
          </button>
        </nav>
      </header>

      <main id="top">
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <p class="eyebrow"><span class="eyebrow-line"></span>Digital / Mindset</p>
            <h1 id="hero-title">Think<br /><em>different.</em><br /><span class="outline-word">Do more.</span></h1>
            <p class="hero-text">DM 是一个小小的起点，记录想法、连接人与行动。把注意力放在真正重要的事上。</p>
            <a class="button button-primary" href="#about">探索 DM <span aria-hidden="true">↗</span></a>
          </div>
          <div class="hero-art" aria-label="DM 抽象图形" role="img">
            <div class="art-ring art-ring-large"></div>
            <div class="art-ring art-ring-small"></div>
            <div class="art-block art-block-top"></div>
            <div class="art-block art-block-bottom"></div>
            <span class="art-label">01 / 04</span>
            <span class="art-mark">DM</span>
          </div>
        </section>

        <section class="signal-strip" aria-label="DM 关键词">
          <span>Curiosity</span><span class="signal-star" aria-hidden="true">✳</span>
          <span>Clarity</span><span class="signal-star" aria-hidden="true">✳</span>
          <span>Momentum</span><span class="signal-star" aria-hidden="true">✳</span>
        </section>

        <section class="about-section" id="about" aria-labelledby="about-title">
          <div>
            <p class="section-kicker">01 — The idea</p>
            <h2 id="about-title">Small letters.<br /><span>Big energy.</span></h2>
          </div>
          <div class="about-content">
            <p>好的事情通常从一个简单的问题开始：如果再往前一步，会发生什么？DM 相信，清晰的想法值得被看见，也值得被实现。</p>
            <a class="text-link" href="#contact">聊聊你的想法 <span aria-hidden="true">→</span></a>
          </div>
        </section>
      </main>

      <footer class="site-footer" id="contact">
        <p>© <span id="year"></span> DM Studio</p>
        <a href="mailto:hello@example.com">hello@example.com <span aria-hidden="true">↗</span></a>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
